services:
  api:
    image: node:24-slim
    container_name: anonchat-api
    working_dir: /app
    command: sh -lc "npm install && npm run start:dev"
    environment:
      PORT: 3000
      APP_ORIGIN: "*"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/anon_chat
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: 86400
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anon_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
